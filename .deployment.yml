stages:
  - deploy

variables:
  BACKEND_SRC: "src/backend"
  FRONTEND_SRC: "src/frontend"
  PUBLIC_DIR: "public"
  BACKEND_PROD_URL: "rotmp-back.cluster-ig3.igpolytech.fr"
  FRONTEND_PROD_URL: "rotmp.cluster-ig3.igpolytech.fr"
  GITHUB_REPO: "https://$GITHUB_TOKEN@github.com/dawoldo/WebDeploymentBranches.git"

before_script:
  - apt-get update -y && apt-get install -y git sed
  - git config --global user.name "GitLab CI"
  - git config --global user.email "ci@example.com"

deploy-backend:
  stage: deploy
  script:
    # Clone repository
    - git clone "${GITHUB_REPO}" deployment-repo
    - cd deployment-repo
    
    # Create or checkout backend branch
    - git checkout prod-backend || (git checkout --orphan prod-backend && git rm -rf .)
    
    # Add only backend files
    - git checkout origin/main -- "${BACKEND_SRC}" "dockerfile.backend"
    - mv dockerfile.backend Dockerfile
    
    # Replace URLs
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_PROD_URL}|g" {} +
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_PROD_URL}|g" {} +
    
    # Commit and push
    - git add -A
    - git commit -m "Backend deployment $(date +%Y-%m-%d_%H:%M:%S)"
    - git push origin prod-backend --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-frontend:
  stage: deploy
  script:
    # Clone repository
    - git clone "${GITHUB_REPO}" deployment-repo
    - cd deployment-repo
    
    # Create or checkout frontend branch
    - git checkout prod-frontend || (git checkout --orphan prod-frontend && git rm -rf .)
    
    # Add only frontend files
    - git checkout origin/main -- "${FRONTEND_SRC}" "${PUBLIC_DIR}" "dockerfile.frontend"
    - mv dockerfile.frontend Dockerfile
    
    # Replace URLs
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_PROD_URL}|g" {} +
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_PROD_URL}|g" {} +
    - find "${PUBLIC_DIR}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_PROD_URL}|g" {} +
    - find "${PUBLIC_DIR}" -type f -exec sed -i "s|localhost:8000|${BACKEND_PROD_URL}|g" {} +
    
    # Commit and push
    - git add -A
    - git commit -m "Frontend deployment $(date +%Y-%m-%d_%H:%M:%S)"
    - git push origin prod-frontend --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual