stages:
  - deploy

variables:
  GITHUB_REPO: "https://$GITHUB_TOKEN@github.com/dawoldo/Web"
  BACKEND_SRC: "src/backend"
  FRONTEND_SRC: "src/frontend"

before_script:
  - apt-get update -y && apt-get install -y git
  - git config --global user.name "GitLab CI"
  - git config --global user.email "ci@example.com"
  - git remote add github "${GITHUB_REPO}" || echo "GitHub remote exists"
  - git fetch origin

deploy-backend:
  stage: deploy
  script:
    # Create completely clean branch
    - git checkout --orphan prod-backend
    - git reset --hard
    - git clean -fd
    # Checkout only what we need
    - mkdir -p "${BACKEND_SRC}"
    - git checkout origin/main -- "${BACKEND_SRC}/"
    # Commit only the backend files
    - git add -f "${BACKEND_SRC}"
    - git commit -m "Deploy backend $(date +'%Y-%m-%d %H:%M')"
    - git push github prod-backend --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-frontend:
  stage: deploy
  script:
    - git checkout --orphan prod-frontend
    - git reset --hard
    - git clean -fd
    - mkdir -p "public" "${FRONTEND_SRC}"
    - git checkout origin/main -- "public/" "${FRONTEND_SRC}/"
    - git add -f "public" "${FRONTEND_SRC}"
    - git commit -m "Deploy frontend $(date +'%Y-%m-%d %H:%M')"
    - git push github prod-frontend --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual