stages:
  - deploy

variables:
  DOKKU_BACKEND_REMOTE: "dokku@cluster-ig3.igpolytech.fr:rotmp-back"
  DOKKU_FRONTEND_REMOTE: "dokku@cluster-ig3.igpolytech.fr:rotmp"
  BACKEND_SRC: "src/backend"
  FRONTEND_SRC: "src/frontend"
  BACKEND_URL_REPLACEMENT: "rotmp-back.cluster-ig3.igpolytech.fr"
  FRONTEND_URL_REPLACEMENT: "rotmp.cluster-ig3.igpolytech.fr"

before_script:
  - apt-get update -y && apt-get install -y git
  - git config --global user.name "GitLab CI"
  - git config --global user.email "ci@example.com"
  - git remote add github "${GITHUB_REPO}" || echo "GitHub remote exists"
  - git fetch origin

deploy-backend:
  stage: deploy
  script:
    # Create clean branch
    - git checkout --orphan prod-backend
    - git reset --hard
    
    # Get backend files and Dockerfile
    - mkdir -p "${BACKEND_SRC}"
    - git checkout origin/main -- "${BACKEND_SRC}/" "dockerfile.backend"
    
    # Rename Dockerfile for Dokku
    - mv dockerfile.backend Dockerfile

    # Replace ALL occurrences regardless of prefix
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +
    
    # Push to Dokku
    - git remote add dokku-backend "${DOKKU_BACKEND_REMOTE}" || true
    - git push dokku-backend prod-backend:master --force
    
    # Clean up
    - rm -rf *
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-frontend:
  stage: deploy
  script:
    # Create clean branch
    - git checkout --orphan prod-frontend
    - git reset --hard
    
    # Get frontend files
    - mkdir -p "public" "${FRONTEND_SRC}"
    - git checkout origin/main -- "public/" "${FRONTEND_SRC}/" "dockerfile.frontend"
    
    # Rename Dockerfile
    - mv dockerfile.frontend Dockerfile

    # Replace ALL occurrences regardless of prefix
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +
    - find "public" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +
    - find "public" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +

    # Push to Dokku
    - git remote add dokku-frontend "${DOKKU_FRONTEND_REMOTE}" || true
    - git push dokku-frontend prod-frontend:master --force
    
    # Clean up
    - rm -rf *
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual