stages:
  - deploy

variables:
  DOKKU_BACKEND_REMOTE: "dokku@cluster-ig3.igpolytech.fr:rotmp-back"
  BACKEND_SRC: "src/backend"
  BACKEND_URL_REPLACEMENT: "rotmp-back.cluster-ig3.igpolytech.fr"
  FRONTEND_URL_REPLACEMENT: "rotmp.cluster-ig3.igpolytech.fr"

before_script:
  - apt-get update -y && apt-get install -y git openssh-client
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  # Add your EXACT private key (without passphrase)
  - echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
  - chmod 600 ~/.ssh/id_ed25519
  # Force SSH to use ONLY this key
  - echo "IdentityFile ~/.ssh/id_ed25519" > ~/.ssh/config
  - echo "IdentitiesOnly yes" >> ~/.ssh/config
  # Verify host
  - ssh-keyscan cluster-ig3.igpolytech.fr >> ~/.ssh/known_hosts
  - git config --global user.name "GitLab CI"
  - git config --global user.email "ci@example.com"

deploy-backend:
  stage: deploy
  script:
    # Test SSH connection first (debugging)
    - ssh -vT dokku@cluster-ig3.igpolytech.fr
    
    # Prepare deployment branch
    - git checkout --orphan dokku-deploy
    - git reset --hard
    - git checkout origin/main -- "${BACKEND_SRC}" dockerfile.backend
    - mv dockerfile.backend Dockerfile

    # Replace URLs (as in GitHub Actions)
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +
    - find "${BACKEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +

    # Commit and push
    - git add -A
    - git commit -m "Dokku deployment"
    - git remote add dokku "${DOKKU_BACKEND_REMOTE}"
    - git push dokku dokku-deploy:master --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

      deploy-frontend:
  stage: deploy
  script:
    # Verify SSH connection first
    - ssh -vT dokku@cluster-ig3.igpolytech.fr
    
    # Prepare frontend files
    - git checkout --orphan dokku-frontend
    - git reset --hard
    - git checkout origin/main -- "public/" "${FRONTEND_SRC}/" "dockerfile.frontend"
    - mv dockerfile.frontend Dockerfile

    # Replace URLs (same pattern as backend)
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +
    - find "${FRONTEND_SRC}" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +
    - find "public" -type f -exec sed -i "s|localhost:3000|${FRONTEND_URL_REPLACEMENT}|g" {} +
    - find "public" -type f -exec sed -i "s|localhost:8000|${BACKEND_URL_REPLACEMENT}|g" {} +

    # Commit and push
    - git add -A
    - git commit -m "Frontend deployment"
    - git remote add dokku-frontend "${DOKKU_FRONTEND_REMOTE}"
    - git push dokku-frontend dokku-frontend:master --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual